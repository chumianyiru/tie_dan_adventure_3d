name: Build Godot Android & iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  actions: read

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: tie_dan_adventure_3d

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Verify Godot & export templates
        run: |
          export HOME=/root
          which godot && godot --version
          ls -la /root/.local/share/godot/export_templates/ || true
          ls -la /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true
      - name: Configure Godot Android settings
        run: |
          export HOME=/root
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java SDK: $JAVA_HOME"
          mkdir -p /root/.config/godot
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' "export/android/java_sdk_path = \"$JAVA_HOME\"" > /root/.config/godot/editor_settings-4.tres
          cat /root/.config/godot/editor_settings-4.tres
      - name: Export Android APK
        run: |
          export HOME=/root
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/${EXPORT_NAME}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk

  build-ios:
    runs-on: macos-latest
    env:
      GODOT_ZIP: Godot_v4.3-stable_macos.universal.zip
      TEMPLATES_ZIP: Godot_v4.3-stable_export_templates.tpz
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot macOS editor
        run: |
          curl --retry 5 --retry-delay 5 --max-time 120 -LO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}
          unzip -q ${GODOT_ZIP}
          mv Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
      - name: Install export templates
        run: |
          curl --retry 5 --retry-delay 5 --max-time 120 -LO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_ZIP}
          TMPDIR=$(mktemp -d)
          unzip -q ${TEMPLATES_ZIP} -d "$TMPDIR"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates
          # 新版 tpz 解压后是 templates/ 目录，需要重命名为版本号
          if [ -d "$TMPDIR/templates" ]; then
            mv "$TMPDIR/templates" ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          else
            mv "$TMPDIR"/$(ls "$TMPDIR") ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          fi
          cat ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/version.txt || true
          ls -la ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/
      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "iOS" build/ios/${EXPORT_NAME}.xcodeproj
      - name: Build iOS app (unsigned)
        run: |
          cd build/ios
          xcodebuild -project ${EXPORT_NAME}.xcodeproj -scheme ${EXPORT_NAME} -sdk iphoneos -configuration Release archive -archivePath ${EXPORT_NAME}.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | tee xcodebuild.log
          mkdir -p Payload
          cp -R ${EXPORT_NAME}.xcarchive/Products/Applications/*.app Payload/ || true
          # fallback: find .app anywhere in archive
          find ${EXPORT_NAME}.xcarchive -name "*.app" -maxdepth 4 -exec cp -R {} Payload/ \;
          zip -r ${EXPORT_NAME}-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/**/*.ipa

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Collect release files
        run: |
          mkdir -p release
          find ./artifacts -type f | while read f; do
            cp "$f" "release/$(basename "$f")"
          done
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 铁蛋的冒险日记 3D ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
